name: Deploy Diwali website to Hostinger

# Manual only until Hostinger VPS and GitHub Actions secrets are configured.
# To enable automatic redeploys, add a 'push' trigger after the first successful manual deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diwali-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy updated website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html Dockerfile nginx.conf compose.yaml; do
            test -s "$f" || { echo "Missing file: $f"; exit 1; }
          done

      - name: Configure verified SSH connection
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy updated page and restart only Diwali container
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          dest="/opt/diwali-gift"
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port")
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$dest'"
          rsync -az --chmod=F644,D755 \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $port" \
            index.html Dockerfile nginx.conf compose.yaml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:$dest/"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '$dest' && test -s .env && docker compose config --quiet && docker compose up -d --build --no-deps diwali && docker compose ps diwali"
